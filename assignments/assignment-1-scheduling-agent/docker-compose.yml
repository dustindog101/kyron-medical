version: '3.8'

services:
  scheduling-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kyron-scheduling-agent
    restart: always
    ports:
      - "5000:5000"
      - "80:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=kyron-production-secret-2026
      - FLASK_ENV=production
    volumes:
      - data-volume:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  data-volume:
